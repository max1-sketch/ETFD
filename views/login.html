<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f17] text-slate-200">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management Portal - Operations Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Subtle Architectural Blueprint Grid (2% Opacity) */
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    /* Crisp Input Styling */
    .input-field {
      background: #111726;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-field:focus-within {
      border-color: #475569;
      box-shadow: 0 0 0 2px rgba(71, 85, 105, 0.2);
    }

    /* Loading Progress Bar */
    @keyframes progressAnim {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    .animate-progress {
      animation: progressAnim 1.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="h-full bg-[#0b0f17] text-slate-200 select-none overflow-x-hidden flex flex-col justify-between min-h-screen bg-grid-pattern">

  <!-- TOP HEADER NAVBAR -->
  <header class="relative z-10 w-full px-6 py-4 flex items-center justify-between border-b border-slate-800/80 bg-[#0d121f]/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700/80 flex items-center justify-center text-slate-300">
        <i class="fa-solid fa-server text-xs"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold tracking-wider text-slate-100 uppercase">Staff Operations</span>
        <span class="text-[10px] font-mono font-medium px-1.5 py-0.5 rounded bg-slate-800/80 border border-slate-700/60 text-slate-400">v2.5.0</span>
      </div>
    </div>

    <div class="flex items-center gap-5 text-xs">
      <div class="flex items-center gap-2 bg-[#111726] px-3 py-1.5 rounded-lg border border-slate-800/80">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="text-slate-300 font-medium text-[11px]">Systems Operational</span>
      </div>
      <div class="hidden sm:flex items-center gap-2 text-slate-400 font-mono text-[11px]">
        <i class="fa-regular fa-clock text-slate-500"></i>
        <span id="utcClockDisplay">00:00:00 UTC</span>
      </div>
    </div>
  </header>

  <!-- MAIN LOGIN CARD -->
  <main class="relative z-10 flex-1 flex items-center justify-center p-4 sm:p-6 my-auto">
    <div class="w-full max-w-sm bg-[#0f1523] border border-slate-800 rounded-xl p-6 sm:p-8 shadow-xl space-y-6">
      
      <!-- LOGO & TITLE -->
      <div class="space-y-1.5 text-center">
        <div class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700/80 flex items-center justify-center text-slate-200 mx-auto shadow-sm mb-3">
          <i class="fa-solid fa-shield-halved text-base"></i>
        </div>
        <h1 class="text-lg font-bold text-slate-100">Staff Portal Sign In</h1>
        <p class="text-xs text-slate-400">Enter your authorized credentials to access management console</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="commandLoginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        
        <!-- USERNAME FIELD -->
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300 block">Username</label>
          <div class="input-field rounded-lg px-3.5 py-2.5 flex items-center gap-3">
            <i class="fa-regular fa-user text-slate-500 text-xs shrink-0"></i>
            <input 
              type="text" 
              id="usernameInput" 
              required 
              placeholder="Enter username..." 
              class="w-full bg-transparent text-slate-100 placeholder-slate-500 text-xs focus:outline-none" 
            />
          </div>
        </div>

        <!-- PASSWORD FIELD -->
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300 block">Access Key</label>
          <div class="input-field rounded-lg px-3.5 py-2.5 flex items-center gap-3">
            <i class="fa-solid fa-key text-slate-500 text-xs shrink-0"></i>
            <input 
              type="password" 
              id="passwordInput" 
              required 
              placeholder="••••••••••••" 
              class="w-full bg-transparent text-slate-100 placeholder-slate-500 text-xs focus:outline-none" 
            />
          </div>
        </div>

        <!-- REMEMBER ME CHECKBOX -->
        <div class="pt-0.5 flex items-center justify-between">
          <label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="rememberSessionToggle" checked class="w-3.5 h-3.5 rounded bg-[#0b0f17] border-slate-700 text-slate-600 focus:ring-0 cursor-pointer" />
            <span class="text-xs text-slate-300">Remember session</span>
          </label>
        </div>

        <!-- SUBMIT BUTTON & PROGRESS BAR -->
        <div class="pt-2 space-y-3">
          <button 
            type="submit" 
            id="loginSubmitBtn" 
            class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-800 text-slate-100 text-xs font-semibold rounded-lg transition-colors border border-slate-700/80 shadow-sm flex items-center justify-center gap-2 cursor-pointer"
          >
            <span>Sign In</span>
            <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>
          </button>

          <!-- CLEAN LOADING BAR (VISIBLE ON SUBMIT) -->
          <div id="loginProgressBar" class="hidden w-full bg-slate-800 h-1 rounded-full overflow-hidden">
            <div class="bg-slate-400 h-full animate-progress rounded-full"></div>
          </div>
        </div>

        <!-- ERROR MESSAGE CONTAINER -->
        <div id="loginErrorBox" class="hidden p-3 bg-red-950/20 border border-red-500/30 rounded-lg text-center space-y-1">
          <div class="text-xs font-semibold text-red-400 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-circle-exclamation text-xs"></i>
            <span>Authentication Failed</span>
          </div>
          <p id="loginErrorText" class="text-[11px] text-slate-300">Invalid username or staff access key.</p>
        </div>

      </form>
    </div>
  </main>

  <!-- BOTTOM COMPACT TELEMETRY FOOTER -->
  <footer class="relative z-10 w-full px-4 sm:px-6 py-4 border-t border-slate-800/80 bg-[#0d121f]/90 backdrop-blur-md">
    <div class="max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-3">
      
      <!-- BENTO 1: PLAYER COUNT -->
      <div class="p-3 bg-[#111726] border border-slate-800/80 rounded-lg flex items-center justify-between">
        <div class="space-y-0.5">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 block">Active Players</span>
          <div class="flex items-baseline gap-2">
            <span class="text-sm font-bold text-slate-200">1,428</span>
            <span class="text-[10px] font-mono text-emerald-400 font-medium">+4.2%</span>
          </div>
        </div>
        <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div class="bg-emerald-500 h-full w-[72%]"></div>
        </div>
      </div>

      <!-- BENTO 2: SERVERS ONLINE -->
      <div class="p-3 bg-[#111726] border border-slate-800/80 rounded-lg flex items-center justify-between">
        <div class="space-y-0.5">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 block">Servers Online</span>
          <div class="flex items-baseline gap-2">
            <span class="text-sm font-bold text-slate-200">12 / 12</span>
            <span class="text-[10px] font-mono text-slate-400">100%</span>
          </div>
        </div>
        <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div class="bg-slate-400 h-full w-full"></div>
        </div>
      </div>

      <!-- BENTO 3: SYSTEM LATENCY -->
      <div class="p-3 bg-[#111726] border border-slate-800/80 rounded-lg flex items-center justify-between">
        <div class="space-y-0.5">
          <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 block">System Latency</span>
          <div class="flex items-baseline gap-2">
            <span class="text-sm font-bold text-slate-200">11ms</span>
            <span class="text-[10px] font-mono text-emerald-400 font-medium">Optimal</span>
          </div>
        </div>
        <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div class="bg-emerald-500 h-full w-[25%]"></div>
        </div>
      </div>

    </div>
  </footer>

  <!-- CLIENT JAVASCRIPT HANDLER -->
  <script>
    // Live UTC Clock Updates
    function updateClock() {
      const now = new Date();
      const clockEl = document.getElementById('utcClockDisplay');
      if (clockEl) {
        clockEl.innerText = now.toISOString().substring(11, 19) + ' UTC';
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Login Form Handler
    async function handleLoginSubmit(e) {
      e.preventDefault();

      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginSubmitBtn');
      const progressBar = document.getElementById('loginProgressBar');
      const errorBox = document.getElementById('loginErrorBox');
      const errorText = document.getElementById('loginErrorText');

      if (!username || !password) return;

      btn.disabled = true;
      btn.innerHTML = `<span>Authenticating...</span>`;
      if (progressBar) progressBar.classList.remove('hidden');
      errorBox.classList.add('hidden');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          btn.className = "w-full py-2.5 bg-emerald-800/80 text-emerald-100 text-xs font-semibold rounded-lg shadow-sm flex items-center justify-center gap-2";
          btn.innerHTML = `<i class="fa-solid fa-check text-xs"></i> <span>Success. Redirecting...</span>`;
          setTimeout(() => {
            window.location.href = data.redirect || '/dashboard';
          }, 350);
        } else {
          btn.disabled = false;
          btn.className = "w-full py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-800 text-slate-100 text-xs font-semibold rounded-lg transition-colors border border-slate-700/80 shadow-sm flex items-center justify-center gap-2 cursor-pointer";
          btn.innerHTML = `<span>Sign In</span> <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>`;
          if (progressBar) progressBar.classList.add('hidden');

          errorText.innerText = data.message || "Invalid username or access key.";
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        btn.disabled = false;
        btn.className = "w-full py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-800 text-slate-100 text-xs font-semibold rounded-lg transition-colors border border-slate-700/80 shadow-sm flex items-center justify-center gap-2 cursor-pointer";
        btn.innerHTML = `<span>Sign In</span> <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>`;
        if (progressBar) progressBar.classList.add('hidden');

        errorText.innerText = "Server connection timeout.";
        errorBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
